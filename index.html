<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#132238" />
    <title>Corretor Prime</title>
    <meta
      name="description"
      content="Encontre imoveis compativeis com seu perfil e receba atendimento personalizado do inicio a entrega das chaves."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Splash de carregamento: cobre o flash do conteudo pre-renderizado (que
         existe no HTML para SEO/IA) ate o app React montar. Nao esconde o
         conteudo do DOM — apenas o sobrepoe visualmente. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f4f5;
        transition: opacity 0.35s ease;
      }
      #splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash .spinner {
        width: 38px;
        height: 38px;
        border-radius: 9999px;
        border: 3px solid rgba(19, 34, 56, 0.15);
        border-top-color: rgba(19, 34, 56, 0.6);
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><div class="spinner"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
